# GambitSMP configuration

max-equipped-cards: 5

# how a card is "activated" for the ones with cooldowns:
# right-click while sneaking with an empty hand cycles through your
# equipped active cards and triggers the next one that's off cooldown.
active-trigger: sneak-right-click

drop:
  mystery-card-enabled: true

cooldowns:
  # active (sneak+right-click) cards
  nightbringer-seconds: 180
  warden-beam-seconds: 180
  gravity-seconds: 45      # was 120 - way too long
  negation-seconds: 45
  berserk-seconds: 30

  # passive on-hit/on-tick cards - cooldown starts the moment they successfully
  # proc, separate from their proc chance
  grounding-bolt-seconds: 14   # nerfed further, was 8
  frozen-anchor-seconds: 12
  vampiric-seconds: 8
  gluttonous-seconds: 6
  piggys-weight-seconds: 10
  dark-hours-seconds: 45
  hellflame-seconds: 12         # was 15 - shortened so it doesn't get dominated by its own Fire Resistance duration
  phantom-seconds: 20           # new - on top of the hit-count requirement

  # double-jump triggered card, not a right-click ability
  jet-kick-seconds: 30

chances:
  # active cards now also have a flat chance to actually go off even when off
  # cooldown - sneaking+right-clicking is no longer a guaranteed activation
  active-ability-trigger: 0.15

  frozen-anchor: 0.10
  grounding-bolt: 0.10
  metal-thief: 0.25
  heavy-swing: 0.06         # was 0.03 - had been nerfed low enough to feel non-functional
  dark-hours-per-minute: 0.10
  gruesome-harvest-per-30s: 0.10
  greeds-touch: 0.25
  vampiric: 0.15

# Piggy's Weight: fall damage threshold to proc (roughly 5 blocks worth - vanilla
# fall damage is ~1 per block past the first 3, so 5 blocks ≈ 2.0 damage)
piggys-weight:
  fall-damage-threshold: 2.0

# Hellflame: Fire Resistance duration deliberately shorter than the cooldown above -
# if it lasted longer than the cooldown, the player would still be fire-immune (and
# therefore unable to be "on fire" to re-trigger it) even after the cooldown clears,
# which is what made it seem broken/permanently on cooldown before this fix.
hellflame:
  fire-resistance-ticks: 160   # 8 seconds

# Phantom rework: land this many hits to trigger a burst of true invisibility.
# Also gated by cooldowns.phantom-seconds now, on top of the hit requirement.
phantom:
  hits-needed: 4        # was 3
  duration-ticks: 40    # 2 seconds, was 5

# Jet Kick: double-jump (two jumps within this window) to dash in your look
# direction, damaging anyone you pass through.
jet-kick:
  double-jump-window-ms: 400
  dash-power: 1.8
  damage-hearts: 2

card-dimension:
  world-name: CardDimension
  overworld-world-name: world   # the world CardDimension's portal sends players to
  surface-y: 64
  portal-width: 5    # interior width (blocks between the side posts)
  portal-height: 4   # interior height (blocks between the lintel and sill)
  ore:
    coal-per-chunk: 20
    iron-per-chunk: 18
    gold-per-chunk: 10
    redstone-per-chunk: 16
    lapis-per-chunk: 10
    copper-per-chunk: 18
    ancient-debris-per-chunk: 4   # netherite source - see README for why this stands in for "netherite ore"
  tree:
    chance-per-chunk: 0.12   # spaced out, not a dense forest
